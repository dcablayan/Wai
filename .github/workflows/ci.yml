name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.30"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-extras

      - name: Compile every Python surface
        run: uv run python -m compileall -q src scripts tests Hohonu-1 app.py

      - name: Build wheel and source distribution
        run: uv build

      - name: Lint correctness rules
        run: uv run ruff check src scripts tests Hohonu-1 app.py

      - name: Type-check security and provenance boundaries
        run: uv run mypy src/artifacts.py src/evidence.py scripts/check_report_freshness.py

      - name: Verify checked-in evidence freshness
        run: uv run python -m scripts.check_report_freshness

      - name: Generate complete offline demo evidence
        env:
          NOAA_OFFLINE: "1"
        run: make demo

      - name: Re-verify generated evidence freshness
        run: uv run python -m scripts.check_report_freshness

      - name: Dashboard import smoke test
        run: uv run python -c "import app; print('app.py imports OK')"

      - name: Run tests with branch coverage
        run: >-
          uv run pytest tests/ -v --tb=short
          --cov=src --cov=scripts
          --cov-branch --cov-report=term-missing --cov-report=json:/tmp/wai-core-coverage.json
          --cov-fail-under=70

      - name: Measure legacy service and evaluation coverage
        run: >-
          uv run pytest tests/test_api_security.py tests/test_legacy_stack.py -v --tb=short
          --cov=Hohonu-1 --cov-branch --cov-report=term-missing
          --cov-report=json:/tmp/wai-legacy-coverage.json --cov-fail-under=0

      - name: Enforce critical-module coverage floors
        run: >-
          uv run python -m scripts.check_critical_coverage
          /tmp/wai-core-coverage.json /tmp/wai-legacy-coverage.json

      - name: Audit locked runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --extra api --output-file /tmp/wai-runtime.txt
          uv run pip-audit --requirement /tmp/wai-runtime.txt

      - name: Upload reports as artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: wai-reports-py${{ matrix.python-version }}
          path: reports/
          retention-days: 7
