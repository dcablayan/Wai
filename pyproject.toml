[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wai"
version = "2.0.0"
description = "Research control panel for auditable nationwide NOAA water-level estimates"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "requests>=2.32",
    "scikit-learn>=1.6",
    "statsmodels>=0.14.4",
    "streamlit>=1.42",
    "plotly>=6.0",
    "timezonefinder>=8.0",
]

[project.urls]
Repository = "https://github.com/dcablayan/Wai"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "httpx2>=2.7",
    "mypy>=1.15",
    "pip-audit>=2.9",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.12",
]
api = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.uv]
required-version = ">=0.11.30,<0.12"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_configs = true
no_implicit_optional = true

[tool.coverage.run]
branch = true
source = ["src", "scripts", "Hohonu-1"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_empty = true
